<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Details | KARZO'S CART</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#faf7f2;
    color:#222;
}

.order-details-page{
    width:min(1000px,92%);
    margin:60px auto;
}

.back-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#222;
    text-decoration:none;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:30px;
}

.order-details-card{
    background:#fff;
    border-radius:24px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
    padding-bottom:25px;
    border-bottom:1px solid #eee;
}

.order-header h1{
    font-size:28px;
}

.order-status{
    padding:8px 16px;
    border-radius:50px;
    background:#EAF8EE;
    color:#2E8B57;
    font-size:13px;
    font-weight:600;
}

.order-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:35px;
}

.info-box{
    background:#faf7f2;
    border-radius:15px;
    padding:18px;
}

.info-box span{
    display:block;
    color:#888;
    font-size:12px;
    margin-bottom:5px;
}

.info-box strong{
    font-size:15px;
}

.products-title{
    font-size:20px;
    margin-bottom:15px;
}

.order-product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 0;
    border-bottom:1px solid #eee;
    gap:15px;
}

.order-product span{
    font-weight:500;
}

.order-product strong{
    color:#C96C4B;
}

.order-total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:25px;
    font-size:18px;
}

.order-total strong{
    color:#C96C4B;
    font-size:25px;
}

.no-order{
    background:#fff;
    border-radius:24px;
    padding:60px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.no-order i{
    font-size:55px;
    color:#C96C4B;
    margin-bottom:20px;
}

@media(max-width:600px){

    .order-details-page{
        margin:30px auto;
    }

    .order-details-card{
        padding:25px 20px;
    }

    .order-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .order-info{
        grid-template-columns:1fr;
    }

    .order-header h1{
        font-size:23px;
    }

}

</style>

</head>

<body>

<section class="order-details-page">

<a href="orders.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
</a>

<div id="order-details"></div>

</section>


<script>

document.addEventListener("DOMContentLoaded", () => {

    const container =
        document.getElementById("order-details");

    const selectedOrder =
        JSON.parse(localStorage.getItem("selectedOrder"));

    if(!selectedOrder){

        container.innerHTML = `

        <div class="no-order">

            <i class="fa-solid fa-box-open"></i>

            <h2>Order Not Found</h2>

            <p>We couldn't find the selected order.</p>

        </div>

        `;

        return;

    }

    let productsHTML = "";

    selectedOrder.items.forEach(item => {

        productsHTML += `

        <div class="order-product">

            <span>${item.name}</span>

            <strong>
    ₦${item.price.toLocaleString()}
</strong>

        </div>

        `;

    });

    container.innerHTML = `

    <div class="order-details-card">

        <div class="order-header">

            <div>

                <span>ORDER DETAILS</span>

                <h1>Order #${selectedOrder.id}</h1>

            </div>

            <span class="order-status">
                ${selectedOrder.status}
            </span>

        </div>

        <div class="order-info">

            <div class="info-box">

                <span>ORDER DATE</span>

                <strong>${selectedOrder.date}</strong>

            </div>

            <div class="info-box">

                <span>ITEMS</span>

                <strong>${selectedOrder.items.length} item(s)</strong>

            </div>

        </div>

        <h2 class="products-title">
            Products
        </h2>

        <div>

            ${productsHTML}

        </div>

        <div class="order-total">

            <span>Total</span>

            <strong>

    ₦${selectedOrder.total.toLocaleString()}

</strong>

        </div>

    </div>

    `;

});

</script>

</body>

</html>
