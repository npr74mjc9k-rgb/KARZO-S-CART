<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Status | KARZO'S CART</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="success.css">

</head>

<body>

<section class="success-page">

    <div class="success-card">

        <!-- STATUS ICON -->

        <div class="success-icon" id="success-icon">

            <i class="fa-solid fa-circle-check"></i>

        </div>


        <!-- STATUS LABEL -->

        <span id="success-status">
            ORDER CONFIRMED
        </span>


        <!-- TITLE -->

        <h1 id="success-title">
            Thank You For Your Purchase!
        </h1>


        <!-- MESSAGE -->

        <p id="success-message">

            Your order has been placed successfully.
            We'll notify you once it has been shipped.

        </p>


        <!-- ORDER INFORMATION -->

        <div class="success-info">

            <div>

                <small>Order Number</small>

                <h3 id="success-order">
                    KC000000
                </h3>

            </div>


            <div>

                <small>Payment Status</small>

                <h3 id="payment-status">
                    Confirmed
                </h3>

            </div>

        </div>


        <!-- PAYMENT METHOD -->

        <div class="payment-method">

            <small>Payment Method</small>

            <strong id="payment-method">
                Paystack
            </strong>

        </div>


        <!-- BUTTONS -->

        <div class="success-buttons">

            <a href="index.html"
               class="success-btn">

                Continue Shopping

            </a>


            <a href="orders.html"
               class="success-outline">

                View Orders

            </a>

        </div>

    </div>

</section>


<script src="success.js"></script>

</body>

</html>
