<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | KARZO'S CART</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="admin.css">

</head>

<body>

    <!-- ==========================
         ADMIN LOGIN
    ========================== -->

    <section class="admin-login" id="admin-login">

        <div class="login-card">

            <div class="login-logo">
                <i class="fa-solid fa-bag-shopping"></i>
            </div>

            <span>KARZO'S CART</span>

            <h1>Admin Login</h1>

            <p>
                Sign in to manage your store orders.
            </p>

            <form id="admin-login-form">

                <div class="input-group">

                    <label for="admin-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Admin email"
                        required>

                </div>

                <div class="input-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Password"
                        required>

                </div>

                <p id="login-error"
                   class="login-error"></p>

                <button type="submit"
                        id="login-button">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Sign In

                </button>

            </form>

            <a href="index.html"
               class="back-store">

                <i class="fa-solid fa-arrow-left"></i>

                Back To Store

            </a>

        </div>

    </section>


    <!-- ==========================
         ADMIN DASHBOARD
    ========================== -->

    <main class="admin-page"
          id="admin-dashboard"
          style="display:none;">

        <header class="admin-header">

            <div>

                <span>KARZO'S CART</span>

                <h1>Admin Dashboard</h1>

                <p>
                    Manage customer orders and payments.
                </p>

            </div>

            <div class="admin-actions">

                <button id="logout-button"
                        class="logout-button">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </button>

                <a href="index.html"
                   class="back-store">

                    <i class="fa-solid fa-store"></i>

                    Back To Store

                </a>

            </div>

        </header>


        <!-- DASHBOARD STATS -->

        <section class="admin-stats">

            <div class="stat-card">

                <i class="fa-solid fa-box"></i>

                <div>

                    <span>Total Orders</span>

                    <strong id="total-orders">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <i class="fa-solid fa-clock"></i>

                <div>

                    <span>Pending Payments</span>

                    <strong id="pending-orders">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <i class="fa-solid fa-circle-check"></i>

                <div>

                    <span>Paid Orders</span>

                    <strong id="paid-orders">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <i class="fa-solid fa-naira-sign"></i>

                <div>

                    <span>Total Revenue</span>

                    <strong id="total-revenue">
                        ₦0
                    </strong>

                </div>

            </div>

        </section>


        <!-- ORDERS -->

        <section class="admin-orders">

            <div class="orders-heading">

                <div>

                    <span>ORDER MANAGEMENT</span>

                    <h2>Customer Orders</h2>

                </div>

                <button id="refresh-orders">

                    <i class="fa-solid fa-rotate"></i>

                    Refresh

                </button>

            </div>


            <div id="admin-orders-list">

                <div class="loading-orders">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <p>Loading orders...</p>

                </div>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
